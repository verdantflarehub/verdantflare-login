# ADMIN CONFIG REQUIRED:
# Configure REGISTRY_* and KUBERNETES_* repository secrets. Before the first
# release, create verdantflare-login-web and verdantflare-login-api Deployments
# plus the required Login and database Secrets in the verdantflare namespace.
name: build

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

env:
  LOGIN_WEB_VERSION: ${{ github.ref == 'refs/heads/dev' && 'login-web-v1.0.0-dev.2' || 'login-web-v1.1.3' }}
  LOGIN_API_VERSION: ${{ github.ref == 'refs/heads/dev' && 'login-api-v1.0.0-dev.2' || 'login-api-v1.1.3' }}

concurrency:
  group: verdantflare-login-release
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Test and push Login images
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build login web
        env:
          VITE_USE_MOCK: "false"
          VITE_AUTH_API_BASE: /api/auth
          VITE_HUB_URL: ${{ github.ref == 'refs/heads/dev' && 'https://hub.dev.verdantflarehub.com' || 'https://hub.verdantflarehub.com' }}
          VITE_DEV_ADMIN_EMAIL: ${{ github.ref == 'refs/heads/dev' && 'admin@verdantflarehub.com' || '' }}
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image metadata
        id: image
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
        run: |
          set -eu
          registry_endpoint="${REGISTRY_ENDPOINT%/}"
          test -n "$registry_endpoint"
          echo "registry_endpoint=$registry_endpoint" >> "$GITHUB_OUTPUT"
          echo "image_namespace=$registry_endpoint/wod" >> "$GITHUB_OUTPUT"
          echo "image_name=$registry_endpoint/wod/verdantflare" >> "$GITHUB_OUTPUT"

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry_endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Refuse existing image tags
        run: |
          ! docker buildx imagetools inspect "${{ steps.image.outputs.image_name }}:${{ env.LOGIN_WEB_VERSION }}" >/dev/null 2>&1
          ! docker buildx imagetools inspect "${{ steps.image.outputs.image_name }}:${{ env.LOGIN_API_VERSION }}" >/dev/null 2>&1

      - name: Build and push Login web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.image_name }}:${{ env.LOGIN_WEB_VERSION }}
          build-args: |
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ env.LOGIN_WEB_VERSION }}
            NGINX_BASE=${{ steps.image.outputs.image_namespace }}/nginx:1.27
          cache-from: type=gha,scope=login-web
          cache-to: type=gha,mode=max,scope=login-web

      - name: Build and push Login API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.api
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.image_name }}:${{ env.LOGIN_API_VERSION }}
          build-args: |
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ env.LOGIN_API_VERSION }}
          cache-from: type=gha,scope=login-api
          cache-to: type=gha,mode=max,scope=login-api

      - name: Image build success
        run: |
          echo "${{ steps.image.outputs.image_name }}:${LOGIN_WEB_VERSION} built and pushed."
          echo "${{ steps.image.outputs.image_name }}:${LOGIN_API_VERSION} built and pushed."

  deploy:
    name: Deploy Login to Kubernetes
    needs: build-and-push
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        env:
          KUBERNETES_SERVER: ${{ secrets.KUBERNETES_SERVER }}
          KUBERNETES_TOKEN: ${{ secrets.KUBERNETES_TOKEN }}
          KUBERNETES_CA: ${{ secrets.KUBERNETES_CA }}
        run: |
          set -eu
          test -n "$KUBERNETES_SERVER"
          test -n "$KUBERNETES_TOKEN"

          if [ -n "$KUBERNETES_CA" ]; then
            ca_file="$RUNNER_TEMP/kubernetes-ca.crt"
            printf '%s\n' "$KUBERNETES_CA" > "$ca_file"
            kubectl config set-cluster verdantflare \
              --server="$KUBERNETES_SERVER" \
              --certificate-authority="$ca_file" \
              --embed-certs=true
          else
            kubectl config set-cluster verdantflare \
              --server="$KUBERNETES_SERVER" \
              --insecure-skip-tls-verify=true
          fi

          kubectl config set-credentials github-actions --token="$KUBERNETES_TOKEN"
          kubectl config set-context verdantflare \
            --cluster=verdantflare \
            --user=github-actions \
            --namespace=verdantflare

      - name: Update Login deployments
        run: |
          set -eu
          web_image="registry.cn-qingdao.aliyuncs.com/wod/verdantflare:${LOGIN_WEB_VERSION}"
          api_image="registry.cn-qingdao.aliyuncs.com/wod/verdantflare:${LOGIN_API_VERSION}"

          # Fail before changing either image if the production mail Secret is
          # absent or either required value is empty. Never print Secret data.
          kubectl --context verdantflare -n verdantflare get secret login-mail -o json \
            | jq -e '(.data.VF_MAIL_FROM // "") != "" and (.data.VF_RESEND_API_KEY // "") != ""' >/dev/null

          # The old API ignores these variables. Add references without exposing
          # values, wait for that safe rollout, then switch to the new images.
          kubectl --context verdantflare -n verdantflare patch deployment verdantflare-login-api --type strategic \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"verdantflare-login-api","env":[{"name":"VF_MAIL_PROVIDER","value":"resend"},{"name":"VF_MAIL_FROM","valueFrom":{"secretKeyRef":{"name":"login-mail","key":"VF_MAIL_FROM"}}},{"name":"VF_RESEND_API_KEY","valueFrom":{"secretKeyRef":{"name":"login-mail","key":"VF_RESEND_API_KEY"}}}]}]}}}}'
          kubectl --context verdantflare -n verdantflare rollout status deployment/verdantflare-login-api --timeout=5m

          kubectl --context verdantflare -n verdantflare set image deployment/verdantflare-login-web verdantflare-login-web="$web_image"
          kubectl --context verdantflare -n verdantflare set image deployment/verdantflare-login-api verdantflare-login-api="$api_image"
          kubectl --context verdantflare -n verdantflare rollout status deployment/verdantflare-login-web --timeout=5m
          kubectl --context verdantflare -n verdantflare rollout status deployment/verdantflare-login-api --timeout=5m
          kubectl --context verdantflare -n verdantflare get deployment/verdantflare-login-web \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="verdantflare-login-web")].image}{"\n"}'
          kubectl --context verdantflare -n verdantflare get deployment/verdantflare-login-api \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="verdantflare-login-api")].image}{"\n"}'
