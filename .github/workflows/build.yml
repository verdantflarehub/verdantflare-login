# ADMIN CONFIG REQUIRED:
# Configure the repository secrets documented in the deployment README, create/protect the release branch,
# and create the verdantflare-login-secret in the Kubernetes namespace before the first deployment.
name: build

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

env:
  LOGIN_WEB_VERSION: login-web-v1.0.0
  LOGIN_API_VERSION: login-api-v1.0.0

concurrency:
  group: verdantflare-login-release
  cancel-in-progress: false

jobs:
  build:
    name: Test and build images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build login web
        env:
          VITE_USE_MOCK: "false"
          VITE_AUTH_API_BASE: /api/auth
          VITE_HUB_URL: https://hub.verdantflarehub.com
        run: npm run build

      - name: Test login API
        run: go test ./...

      - name: Vet login API
        run: go vet ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image metadata
        id: image
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
        run: |
          registry_endpoint="${REGISTRY_ENDPOINT%/}"

          if [ -z "$registry_endpoint" ]; then
            echo "REGISTRY_ENDPOINT_ALIYUN is required" >&2
            exit 1
          fi

          echo "registry_endpoint=$registry_endpoint" >> "$GITHUB_OUTPUT"
          echo "image_namespace=$registry_endpoint/wod" >> "$GITHUB_OUTPUT"
          echo "image_name=$registry_endpoint/wod/verdantflare" >> "$GITHUB_OUTPUT"

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry_endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Build login web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.image_name }}:${{ env.LOGIN_WEB_VERSION }}
            ${{ steps.image.outputs.image_name }}:${{ env.LOGIN_WEB_VERSION }}-${{ github.sha }}
          build-args: |
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ env.LOGIN_WEB_VERSION }}
            NGINX_BASE=${{ steps.image.outputs.image_namespace }}/nginx:1.27
          cache-from: type=gha,scope=login-web
          cache-to: type=gha,mode=max,scope=login-web

      - name: Build login API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.api
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.image_name }}:${{ env.LOGIN_API_VERSION }}
            ${{ steps.image.outputs.image_name }}:${{ env.LOGIN_API_VERSION }}-${{ github.sha }}
          build-args: |
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ env.LOGIN_API_VERSION }}
          cache-from: type=gha,scope=login-api
          cache-to: type=gha,mode=max,scope=login-api

      - name: Image push success
        run: |
          echo "${{ steps.image.outputs.image_name }}:${LOGIN_WEB_VERSION} built and pushed successfully!"
          echo "${{ steps.image.outputs.image_name }}:${LOGIN_API_VERSION} built and pushed successfully!"

  deploy:
    name: Deploy Login to Kubernetes
    needs: build
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        env:
          KUBERNETES_SERVER: ${{ secrets.KUBERNETES_SERVER }}
          KUBERNETES_TOKEN: ${{ secrets.KUBERNETES_TOKEN }}
          KUBERNETES_CA: ${{ secrets.KUBERNETES_CA }}
        run: |
          set -eu
          test -n "$KUBERNETES_SERVER"
          test -n "$KUBERNETES_TOKEN"

          if [ -n "$KUBERNETES_CA" ]; then
            ca_file="$RUNNER_TEMP/kubernetes-ca.crt"
            printf '%s\n' "$KUBERNETES_CA" > "$ca_file"
            kubectl config set-cluster verdantflare \
              --server="$KUBERNETES_SERVER" \
              --certificate-authority="$ca_file" \
              --embed-certs=true
          else
            kubectl config set-cluster verdantflare \
              --server="$KUBERNETES_SERVER" \
              --insecure-skip-tls-verify=true
          fi

          kubectl config set-credentials github-actions --token="$KUBERNETES_TOKEN"
          kubectl config set-context verdantflare \
            --cluster=verdantflare \
            --user=github-actions \
            --namespace=verdantflare
          kubectl config use-context verdantflare

      - name: Update Login deployments
        run: |
          image_name="registry.cn-qingdao.aliyuncs.com/wod/verdantflare"
          web_image="$image_name:${LOGIN_WEB_VERSION}-${GITHUB_SHA}"
          api_image="$image_name:${LOGIN_API_VERSION}-${GITHUB_SHA}"

          kubectl set image deployment/verdantflare-login-web verdantflare-login-web="$web_image"
          kubectl set image deployment/verdantflare-login-api verdantflare-login-api="$api_image"
          kubectl rollout status deployment/verdantflare-login-web --timeout=5m
          kubectl rollout status deployment/verdantflare-login-api --timeout=5m
          kubectl get deployment/verdantflare-login-web -o jsonpath='{.spec.template.spec.containers[?(@.name=="verdantflare-login-web")].image}{"\n"}'
          kubectl get deployment/verdantflare-login-api -o jsonpath='{.spec.template.spec.containers[?(@.name=="verdantflare-login-api")].image}{"\n"}'
