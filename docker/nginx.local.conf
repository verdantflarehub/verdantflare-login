server {
  listen 8087;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /_auth/session {
    internal;
    proxy_pass http://login-api:8088/api/auth/session;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
  }

  location = /api/control/context {
    auth_request /_auth/session;
    auth_request_set $login_subject $upstream_http_x_vf_login_subject;
    proxy_pass http://verdantflare-service-control:8080/api/control/context;
    proxy_set_header X-VF-Login-Subject $login_subject;
  }

  location /api/auth/ {
    proxy_pass http://login-api:8088/api/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    proxy_pass http://login-api:8088/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|webp|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
